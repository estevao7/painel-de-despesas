<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Despesas</title>
</head>

<body>
  <div id="app" class="layout">
    <aside class="sidebar">
      <h1 class="sidebar__titulo">Painel de Despesas</h1>

      <section class="resumo">
        <h2 class="resumo__label">Total geral</h2>
        <p id="total-geral" class="total-geral">R$ 0,00</p>
      </section>

      <section class="por-categoria">
        <h2 class="por-categoria__label">Por categoria</h2>
        <ul id="totais-por-categoria" class="totais-lista">
          <li class="totais-lista__item" data-categoria="alimento">
            <span class="totais-lista__nome">Alimento</span>
            <span class="totais-lista__valor" data-total-categoria="alimento">R$ 0,00</span>
          </li>
          <li class="totais-lista__item" data-categoria="transporte">
            <span class="totais-lista__nome">Transporte</span>
            <span class="totais-lista__valor" data-total-categoria="transporte">R$ 0,00</span>
          </li>
          <li class="totais-lista__item" data-categoria="lazer">
            <span class="totais-lista__nome">Lazer</span>
            <span class="totais-lista__valor" data-total-categoria="lazer">R$ 0,00</span>
          </li>
          <li class="totais-lista__item" data-categoria="saúde">
            <span class="totais-lista__nome">Saúde</span>
            <span class="totais-lista__valor" data-total-categoria="saúde">R$ 0,00</span>
          </li>
          <li class="totais-lista__item" data-categoria="outros">
            <span class="totais-lista__nome">Outros</span>
            <span class="totais-lista__valor" data-total-categoria="outros">R$ 0,00</span>
          </li>
        </ul>
      </section>
    </aside>

    <main class="conteudo">
      <div class="card">
        <h2 class="card__titulo">Nova despesa</h2>
        <form id="form-despesa" class="form-despesa" novalidate>
          <div class="campo">
            <label class="campo__label" for="titulo">Título</label>
            <input class="campo__input" type="text" id="titulo" name="titulo" placeholder="Ex.: Supermercado"
              autocomplete="off" />
          </div>

          <div class="campo">
            <label class="campo__label" for="valor">Valor</label>
            <input class="campo__input" type="number" id="valor" name="valor" placeholder="0,00" min="0.01"
              step="0.01" />
          </div>

          <div class="campo">
            <label class="campo__label" for="categoria">Categoria</label>
            <select class="campo__input" id="categoria" name="categoria">
              <option value="">Selecione uma categoria</option>
              <option value="alimento">Alimento</option>
              <option value="transporte">Transporte</option>
              <option value="lazer">Lazer</option>
              <option value="saúde">Saúde</option>
              <option value="outros">Outros</option>
            </select>
          </div>

          <button type="submit" class="btn-adicionar">Adicionar despesa</button>
        </form>
        <p id="erro-formulario" class="erro-formulario" hidden></p>
      </div>

      <section class="lista-secao">
        <h2 class="lista-secao__titulo">Despesas</h2>
        <p id="lista-vazia" class="lista-vazia">Nenhuma despesa registrada.</p>
        <ul id="lista-despesas" class="lista-despesas"></ul>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
